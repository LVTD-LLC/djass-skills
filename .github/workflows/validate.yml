name: Validate
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Offline packaging checks
        run: python3 scripts/validate.py
      - name: OpenClaw bundle is in sync with the canonical skill
        run: python3 scripts/sync.py && git diff --exit-code
      - name: install.sh parses
        run: bash -n install.sh
      - name: Claude Code marketplace and plugin validators
        run: |
          npx -y @anthropic-ai/claude-code@2.1.285 plugin validate .
          npx -y @anthropic-ai/claude-code@2.1.285 plugin validate ./plugins/djass
